services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teachingsystem_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_NAME: "${APP_NAME:-TeachingSystem}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE:-teaching_system}"
      DB_USERNAME: "${DB_USERNAME:-teaching_user}"
      DB_PASSWORD: "${DB_PASSWORD:-teaching_secret}"
    volumes:
      - storage_data:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - teachingsystem_net

  db:
    image: postgres:16-alpine
    container_name: teachingsystem_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_DATABASE:-teaching_system}"
      POSTGRES_USER: "${DB_USERNAME:-teaching_user}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-teaching_secret}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-teaching_user} -d ${DB_DATABASE:-teaching_system}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - teachingsystem_net

volumes:
  pgdata:
    driver: local
  storage_data:
    driver: local

networks:
  teachingsystem_net:
    driver: bridge
