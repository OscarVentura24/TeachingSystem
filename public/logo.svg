<svg width="480" height="120" viewBox="0 0 480 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoDrop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="logoCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Emblem Group (left side) -->
  <g transform="translate(10, 10)">
    <!-- Droplet -->
    <path d="M50 8C50 8 16 48 16 70C16 88 31 102 50 102C69 102 84 88 84 70C84 48 50 8 50 8Z" fill="url(#logoDrop)" filter="url(#logoGlow)"/>
    <!-- Highlight -->
    <path d="M50 16C50 16 26 48 26 66C26 71 27 75 29 78C27 75 26 71 26 66C26 50 47 22 50 16Z" fill="#FFFFFF" fill-opacity="0.4"/>
    <!-- Cap Diamond -->
    <path d="M50 38L74 50L50 62L26 50L50 38Z" fill="#FFFFFF"/>
    <path d="M50 42L68 51L50 60L32 51L50 42Z" fill="url(#logoCyan)"/>
    <!-- Cap Arch -->
    <path d="M36 55V64C36 70 42 75 50 75C58 75 64 70 64 64V55" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <!-- Tassel -->
    <path d="M68 52V66M65 66H71" stroke="#E0F2FE" stroke-width="3" stroke-linecap="round"/>
    <!-- Book Waves -->
    <path d="M22 92C30 87 40 88 50 94C60 88 70 87 78 92" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Typography Group (right side) -->
  <text x="120" y="58" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" letter-spacing="-0.03em" fill="#0284C7">
    H<tspan fill="#06B6D4">2</tspan>O
  </text>
  <text x="120" y="88" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" letter-spacing="0.12em" fill="#1E293B">
    TEACHING SYSTEM
  </text>
  <text x="122" y="104" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="11" letter-spacing="0.08em" fill="#64748B">
    EDTECH &amp; LAB SUITE
  </text>
</svg>
